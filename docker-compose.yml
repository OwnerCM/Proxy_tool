name: proxy-tool

# 两个容器：Redis 一个，proxy_pool + 展示层 + 网关合并成的应用一个。
#
#   docker compose pull && docker compose up -d
#
# 这里刻意只写 image、不写 build —— 纯部署用，up 时只会拉镜像，
# 不会在拉不到时悄悄改成本地构建。
# 改了代码想在本地验证，显式构建成同名镜像即可：
#   docker build -t ghcr.io/ownercm/proxy-tool:latest .
#
# 端口：5010 proxy_pool 原生 API / 5050 看板 / 8080 网关(HTTP) / 1080 网关(SOCKS5)
#
# 其余配置（DB_CONN、PROXY_API、PROXY_POOL_DB 等）都已内置在镜像的 ENV 里，
# 默认值开箱即用，所以这里不用重复声明。

services:
  redis:
    image: redis:7-alpine
    container_name: proxy-redis
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '2'

  proxy-tool:
    image: ghcr.io/ownercm/proxy-tool:latest
    container_name: proxy-tool
    restart: unless-stopped
    ports:
      - '5010:5010'
      - '5050:5050'
      - '8080:8080'
      - '1080:1080'
    environment:
      # 必须保留。如果宿主机的 ~/.docker/config.json 里配了 proxies（为了拉镜像走代理，
      # 很常见），Docker 会自动把 HTTP_PROXY 注入容器，届时访问本机 Redis 与
      # proxy_pool 的内部请求会被送去外部代理而失败。
      # 大小写两份都要给：urllib 与 requests 读取的变量名大小写不一致。
      NO_PROXY: 'localhost,127.0.0.1,::1,redis,proxy-redis,proxy-tool'
      no_proxy: 'localhost,127.0.0.1,::1,redis,proxy-redis,proxy-tool'
      # 如果不希望采集器和 GeoIP 查询走宿主机的代理，把下面四行的注释去掉。
      # 反过来说，国内环境访问 GitHub 上的代理源列表时，保留代理往往更好用。
      #HTTP_PROXY: ''
      #HTTPS_PROXY: ''
      #http_proxy: ''
      #https_proxy: ''
    depends_on:
      redis:
        condition: service_healthy
    # docker stop 默认只等 10s，而容器里有 3 个进程要收尾（supervisor 的停机上界
    # 约为 STOP_TIMEOUT + 进程数×1s）。给足余量，避免收尾被 SIGKILL 打断。
    #
    # restart 策略也是容错机制的一部分：supervisor 采用 crash-only —— 任一进程
    # 退出就结束整个容器，由 Docker 负责重启（自带指数退避），
    # 容器内部不做单进程重启。这样进程反复挂会直接表现为容器反复重启，
    # 在监控上是可见的，而不是被"容器仍然 healthy"掩盖掉。
    stop_grace_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
