name: proxy-tool

# 两个容器：Redis 一个，proxy_pool + 展示层 + 网关合并成的应用一个。
#
#   docker compose pull && docker compose up -d
#
# 这里刻意只写 image、不写 build —— 纯部署用，up 时只会拉镜像，
# 不会在拉不到时悄悄改成本地构建。
# 改了代码想在本地验证，显式构建成同名镜像即可：
#   docker build -t ghcr.io/ownercm/proxy-tool:latest .
#
# 端口：5010 proxy_pool 原生 API / 5050 看板 / 8080 网关(HTTP) / 1080 网关(SOCKS5)
#
# 其余配置（DB_CONN、PROXY_API、PROXY_POOL_DB 等）都已内置在镜像的 ENV 里，
# 默认值开箱即用，所以这里不用重复声明。

services:
  redis:
    image: redis:7-alpine
    container_name: proxy-redis
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '2'

  proxy-tool:
    image: ghcr.io/ownercm/proxy-tool:latest
    container_name: proxy-tool
    restart: unless-stopped
    ports:
      - '5010:5010'
      - '5050:5050'
      - '8080:8080'
      - '1080:1080'
    # 不需要 environment：所有配置的默认值都在镜像的 ENV 里，
    # 而 Redis 地址的默认值正好等于上面 redis 服务的名字。
    #
    # 也不需要 NO_PROXY。宿主机若配了 docker 代理，Docker 会把 HTTP_PROXY 注入容器，
    # 但容器里唯一两处访问本机的 HTTP 调用（gateway 读 proxy_pool 的 /all/、
    # 健康检查探端口）都在代码里用 ProxyHandler({}) 显式禁用了代理，比环境变量可靠 ——
    # 环境变量会被 Docker 同时注入的另一个大小写覆盖掉。
    # 其余出站请求都是访问外部代理源站和 GeoIP API，走宿主机代理正是想要的行为。
    depends_on:
      redis:
        condition: service_healthy
    # docker stop 默认只等 10s，而容器里有 3 个进程要收尾（supervisor 的停机上界
    # 约为 STOP_TIMEOUT + 进程数×1s）。给足余量，避免收尾被 SIGKILL 打断。
    #
    # restart 策略也是容错机制的一部分：supervisor 采用 crash-only —— 任一进程
    # 退出就结束整个容器，由 Docker 负责重启（自带指数退避），
    # 容器内部不做单进程重启。这样进程反复挂会直接表现为容器反复重启，
    # 在监控上是可见的，而不是被"容器仍然 healthy"掩盖掉。
    stop_grace_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
