# 测试 → 分架构构建 → 合并 manifest 发布到 GHCR。
#
# amd64 / arm64 各自在原生 runner 上并行构建，按 digest 推送（不带 tag），
# 最后合成一个 multi-arch manifest list 再统一打 tag。
# 这是 Docker 官方推荐的跨多 runner 分布式构建模式，比在 amd64 上用 QEMU
# 模拟 arm64 快得多也稳得多。
#
# arm64 用 GitHub 免费的 ARM runner（公开仓库可用）。若仓库转为私有且无付费额度，
# 把 arm64 那行的 runner 换成 ubuntu-latest，并在 Set up Buildx 前加一步
# docker/setup-qemu-action@v3 走 QEMU 模拟即可。
#
# 首次使用：Settings → Actions → General → Workflow permissions
#           选 "Read and write permissions"

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md', 'docs/**', 'mkdocs.yml']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'mkdocs.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # 刻意写死，不用 github.repository 推导：仓库名是 Proxy_tool（下划线），
  # 而 docker-compose.yml 引用的是 proxy-tool（连字符），推导出来对不上。
  IMAGE_NAME: proxy-tool

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'   # 与镜像里的 Python 版本保持一致

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt -r dashboard/requirements.txt

      - name: proxy_pool test suite
        run: pytest -q

      # assert_layout.py 与 Dockerfile 构建期调的是同一个脚本，两处不会漂移。
      # 它验证的是那些"坏了也不报错"的前提：采集源能被发现、Proxy 带 latency 字段、
      # 离线 GeoIP 库可用、静态资源就位。
      - name: Self checks
        env:
          REDIS_HOST: 127.0.0.1
        run: |
          python -m compileall -q dashboard docker
          python docker/assert_layout.py collisions
          python docker/assert_layout.py proxy_pool
          cd dashboard && python ../docker/assert_layout.py web

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare env
        env:
          OWNER: ${{ github.repository_owner }}
        # GHCR 只接受小写镜像名，而 GitHub 的 owner 名可能含大写字母
        run: echo "IMAGE=${REGISTRY}/${OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # PR 只构建不推送，避免外部 PR 拿到写包权限
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.IMAGE }}
          # 必须关掉 provenance：它会额外生成 attestation manifest，
          # 让单架构推送结果变成 manifest list，后面 imagetools create 会失败
          provenance: false
          # PR 只用缓存不产出镜像；push 时只推 digest，tag 留给 merge job 统一打
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=image,push-by-digest=true,name-canonical=true,push=true' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare env
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE=${REGISTRY}/${OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # 这里就是要让 $() 的结果分词成多个 -t / digest 参数，不能加引号
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      # 打印 manifest 供人工核对，同时断言两个架构都在 —— 本项目就是为了修
      # arm64 缺失，这条断言是防回归的兜底，不能只靠"构建成功"来推断
      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}" | tee /tmp/m.txt
          grep -q 'linux/amd64' /tmp/m.txt && grep -q 'linux/arm64' /tmp/m.txt
