# 唯一的工作流：测试 → 多架构构建 → 发布到 GHCR。
#
# 产物（OWNER 自动转小写）：
#   ghcr.io/OWNER/proxy-tool:latest
#
# ── 为什么上游的 arm64 用不了 ──
# 上游 proxy_pool 的 workflow 直接用裸的 docker/build-push-action，既没有 platforms
# 参数，也没有 buildx/QEMU 准备，所以只产出 amd64 的 manifest，arm64 机器 pull 时会报
# "no matching manifest for linux/arm64/v8"。
#
# ── 这里怎么做 ──
# amd64 和 arm64 各自在**原生 runner** 上构建，按 digest 分别推送（不打 tag），
# 最后用 imagetools 合并成一个 manifest list 再统一打 tag。这是 Docker 官方推荐的
# 跨多 runner 分布式构建模式，比在 amd64 上用 QEMU 模拟 arm64 快得多也稳得多。
# 如果仓库是私有的（拿不到免费 arm64 托管 runner），把仓库变量 ARM_RUNNER 设成
# ubuntu-latest 即可 —— 下面的 QEMU 步骤会自动启用，无需改动工作流。
#
# ── 首次使用 ──
# Settings → Actions → General → Workflow permissions 选 "Read and write permissions"

name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
    paths-ignore: ['**/*.md', 'docs/**', 'mkdocs.yml']
  pull_request:
    branches: [main, master]
    paths-ignore: ['**/*.md', 'docs/**', 'mkdocs.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: proxy-tool

jobs:
  # ────────────────────────── 测试 ──────────────────────────
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt -r dashboard/requirements.txt

      - name: proxy_pool test suite
        run: pytest -q

      # dashboard 侧没有测试套件，至少保证全部模块能编译、能导入。
      # 这能挡住绝大多数手误，也能在手动同步上游代码后立刻发现结构性问题。
      - name: dashboard byte-compile
        run: python -m compileall -q dashboard docker

      # 跟 Dockerfile 构建期用的是同一个脚本，避免两处检查逻辑漂移。
      # 它会验证 util 模块没有串台、ip2region 离线库真的能查、
      # 以及所有会被 supervisor 拉起的模块都能导入。
      - name: layout assertions (dashboard)
        working-directory: dashboard
        run: python ../docker/assert_layout.py dashboard

      - name: layout assertions (proxy_pool)
        run: python docker/assert_layout.py proxy_pool

  # ────────────────────── 分架构构建 ──────────────────────
  build:
    name: build (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.arch == 'arm64' && (vars.ARM_RUNNER || 'ubuntu-24.04-arm') || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      # GHCR 路径必须全小写，而 GitHub 的 owner 名可能含大写
      - name: Resolve image reference
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "REGISTRY_IMAGE=ghcr.io/${OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      # 只有在 runner 架构和目标架构不一致时才需要 QEMU。
      # 用原生 arm64 runner 时这一步会自动跳过。
      - name: Set up QEMU
        if: matrix.arch == 'arm64' && runner.arch != 'ARM64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY_IMAGE }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_VERSION=${{ github.ref_name }}
          # PR 只验证能不能构建，不推送（fork 来的 PR 也没有推送权限）。
          # 非 PR 时只推 digest 不打 tag，tag 留给 publish 阶段统一打。
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=image,push-by-digest=true,name-canonical=true,push=true' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          # 关闭 provenance/sbom：它们会额外生成 attestation manifest，
          # 使单架构推送结果变成 manifest list，后续 imagetools create 会失败
          provenance: false
          sbom: false

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ─────────────── 合并 manifest 并发布 ───────────────
  publish:
    name: publish to GHCR
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve image reference
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "REGISTRY_IMAGE=ghcr.io/${OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          # 这里就是要让 $() 的结果分词成多个 -t / digest 参数，不能加引号
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY_IMAGE}@sha256:%s " *)

      # 直接验收"支持 arm64"这个目标本身，而不是假定构建成功就等于支持
      - name: Verify manifest contains amd64 and arm64
        run: |
          set -euo pipefail
          ref="$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          platforms="$(docker buildx imagetools inspect "$ref" --raw \
            | jq -r '.manifests[] | select(.platform.os != "unknown")
                     | "\(.platform.os)/\(.platform.architecture)"' | sort -u)"
          echo "$platforms"
          for want in linux/amd64 linux/arm64; do
            grep -qx "$want" <<< "$platforms" || { echo "::error::manifest 缺少 $want"; exit 1; }
          done
          {
            echo "### ✅ 已发布 ${REGISTRY_IMAGE}"
            echo
            echo '支持的平台：'
            echo '```'
            echo "$platforms"
            echo '```'
            echo '镜像 tag：'
            echo '```'
            jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
